services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      # Rakendus EI ühendu enam root-kasutajana, vaid piiratud õigustega kasutajana
      DB_HOST: db
      DB_USER: "${DB_USER:-lilia_app}"
      DB_PASSWORD: "${DB_PASSWORD:-lilia_local_dev}"
      DB_NAME: "${DB_NAME:-ilusalong}"
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-lilia_root_local}"
      MYSQL_DATABASE: "${DB_NAME:-ilusalong}"
      MYSQL_USER: "${DB_USER:-lilia_app}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-lilia_local_dev}"
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
      - dbdata:/var/lib/mysql
    # Andmebaasi port ei ole väljaspoole avatud – ligipääs ainult Dockeri võrgust

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      # Ainult arendaja enda masinast (127.0.0.1), mitte kohtvõrgust ega internetist
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  dbdata:
